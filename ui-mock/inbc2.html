      background: "hsl(210 40% 96%)", foreground: "hsl(222 47% 11%)", card: "#fff",
      muted: "hsl(210 40% 96%)", "muted-foreground": "hsl(215 16% 42%)", border: "hsl(214 32% 91%)", input: "hsl(214 32% 84%)",

<style>
  :root { --tn: hsl(222 76% 40%); }
  body { font-family: "Be Vietnam Pro", system-ui, sans-serif; background: hsl(210 40% 96%); color: hsl(222 47% 11%); -webkit-font-smoothing: antialiased; }
  ::selection { background: hsl(222 80% 88%); }
  .tabnum { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--tn); outline-offset: 2px; border-radius: 6px; }
  .nut { height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid hsl(214 32% 84%); background: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .nut:hover { background: hsl(210 40% 96%); }
  .nut:disabled { opacity: .45; cursor: not-allowed; }
  .nut.nho { height: 32px; padding: 0 10px; font-size: 12.5px; line-height: 1; }
  .nut svg { flex-shrink: 0; display: block; }
  .nut.chinh { background: var(--tn); border-color: var(--tn); color: #fff; }
  .nut.chinh:hover { background: hsl(222 76% 34%); }
  .o-tim { height: 36px; border-radius: 8px; border: 1px solid hsl(214 32% 84%); padding: 0 10px 0 32px; font-size: 13px; background: #fff; }
  .o-tim:focus { outline: none; border-color: var(--tn); box-shadow: 0 0 0 3px hsl(222 76% 40% / .15); }
  /* Ký hiệu phần thi */
  .pt { display: inline-flex; gap: 2px; }
  .pt i { font-style: normal; min-width: 20px; height: 20px; padding: 0 3px; border-radius: 4px; font-size: 10.5px; font-weight: 700; display: inline-grid; place-items: center; letter-spacing: -.01em; }
  .pt i.bat { background: var(--tn); color: #fff; }
  .pt i.tat { background: transparent; color: hsl(215 20% 72%); box-shadow: inset 0 0 0 1px hsl(214 32% 86%); }
  .pt.do i.bat { background: hsl(0 72% 46%); }
  .dat { display: inline-flex; gap: 3px; }
  .dat b { font-weight: 700; font-size: 11px; height: 20px; padding: 0 6px 0 4px; border-radius: 999px; display: inline-flex; align-items: center; gap: 2px; color: hsl(142 71% 26%); background: hsl(142 60% 94%); box-shadow: inset 0 0 0 1px hsl(142 45% 78%); }
  th { font-size: 11.5px; font-weight: 600; color: hsl(215 16% 38%); text-align: left; white-space: nowrap; }
  tbody tr { border-bottom: 1px solid hsl(214 32% 93%); }
  tbody tr:hover { background: hsl(222 80% 98.5%); }
  tbody tr.chon { background: hsl(222 80% 96.5%); }
  tbody tr.can { background: hsl(0 80% 98%); }
  .o-nd { min-width: 268px; height: 34px; border-radius: 8px; border: 1px solid hsl(214 32% 86%); background: #fff; padding: 0 8px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; text-align: left; }
  .o-nd:hover { border-color: hsl(222 60% 70%); }
  .o-nd.do { border-color: hsl(0 72% 60%); background: hsl(0 80% 98%); color: hsl(0 72% 38%); }
  .menu { position: fixed; z-index: 50; width: 320px; background: #fff; border-radius: 10px; box-shadow: 0 12px 32px hsl(222 40% 20% / .18), 0 2px 6px hsl(222 40% 20% / .08); border: 1px solid hsl(214 32% 88%); padding: 6px; }
  .menu .nhom { font-size: 10.5px; font-weight: 700; color: hsl(215 16% 46%); letter-spacing: .04em; padding: 8px 8px 4px; }
  .menu button.muc { width: 100%; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px; border-radius: 6px; font-size: 13px; text-align: left; }
  .menu button.muc:hover, .menu button.muc.tro { background: hsl(222 80% 96%); }
  .ophan { min-width: 30px; height: 28px; padding: 0 7px; border-radius: 7px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 3px; transition: background-color .12s ease-out, color .12s ease-out, box-shadow .12s ease-out; }
  .ophan.thi { background: var(--tn); color: #fff; box-shadow: 0 1px 2px hsl(222 76% 30% / .35); }
  .ophan.thi:hover { background: hsl(222 76% 34%); }
  .ophan.dat { background: hsl(142 60% 94%); color: hsl(142 71% 24%); box-shadow: inset 0 0 0 1px hsl(142 45% 74%); }
  .ophan.dat:hover { background: hsl(142 60% 89%); }
  tr.can .ophan.dat { box-shadow: inset 0 0 0 1px hsl(0 72% 75%); }
  .the { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
  .the.md { color: hsl(215 16% 38%); background: hsl(210 40% 94%); }
  .the.lai { color: hsl(222 70% 34%); background: hsl(222 80% 94%); }
  .the.do { color: hsl(0 72% 40%); background: hsl(0 80% 95%); }
  .loc { height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid hsl(214 32% 86%); background: #fff; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .loc[aria-pressed="true"] { border-color: var(--tn); background: hsl(222 80% 96%); color: hsl(222 70% 30%); font-weight: 600; }
  .loc.do { border-color: hsl(0 72% 75%); color: hsl(0 72% 38%); }
  .giay { background: #fff; box-shadow: 0 2px 10px hsl(222 30% 20% / .18); }
  @keyframes quay { to { transform: rotate(360deg); } }
  .quay { animation: quay .8s linear infinite; }
  .mockbar { background: hsl(222 47% 11%); color: hsl(210 40% 92%); }
  .mockbar button[aria-pressed="true"] { background: hsl(222 50% 30%); color: #fff; }
</style>

// Ô phần thi bấm được: xanh đậm = phải thi · xanh lá có ✓ = đã đạt (không thi)

  const dat = h.dat.includes(p), ten = DM[S.loai].ten[p];

  const goi = dat ? `${ten} — đã đạt${goc}. Bấm để bắt thi lại.` : `${ten} — phải thi. Bấm nếu đã đạt.`;
  return `<button class="ophan ${dat ? "dat" : "thi"}" aria-pressed="${!dat}" title="${goi}" aria-label="${goi}" data-act="pt" data-i="${h.i}" data-p="${p}">${dat ? IC.dau : ""}${p}</button>`;
}

    if (S.loc === "lai") return daSua(h);

    ${can ? `<button class="loc do" data-loc="can" aria-pressed="${S.loc === "can"}">${IC.canh}Chưa có phần thi <b class="tabnum">${can}</b></button>` : ""}
    ${lai ? `<button class="loc" data-loc="lai" aria-pressed="${S.loc === "lai"}">Đã sửa <b class="tabnum">${lai}</b></button>` : ""}
    <span class="ml-auto text-[12px] text-muted-foreground">${S.luu ? `Đã lưu ${S.luu} · ` : ""}Chỉ đổi bản in — DB Nạp và gói gửi Sở không đổi</span>
  </div>
  <div class="px-4 py-2 text-[12px] text-muted-foreground flex items-center gap-3 border-b border-border bg-[hsl(210_40%_98.5%)]">

    <span class="inline-flex items-center gap-1.5"><span class="ophan dat" style="pointer-events:none">${IC.dau}L</span> đã đạt, không thi</span>
    <span>· Bấm một ô để đổi; cột Ghi chú tự đổi theo. ${S.loai === "oto" ? "Ô tô: Lý thuyết · Sa hình · Đường (không còn mô phỏng từ 01/07/2025)." : "Mô tô: Lý thuyết · Thực hành."}</span>

    <tbody>${ds.map((h) => dong(h)).join("") || `<tr><td colspan="7" class="py-10 text-center text-muted-foreground">Không có học viên khớp bộ lọc.</td></tr>`}</tbody>
  </table></div>

    <span class="inline-flex gap-1">${DM[S.loai].phan.map((p) => {
      const tatCaDat = hvChon.every((h) => h.dat.includes(p));
      return `<button class="ophan ${tatCaDat ? "dat" : "thi"}" data-act="ptLoat" data-p="${p}" aria-pressed="${!tatCaDat}" title="${DM[S.loai].ten[p]}: bấm để ${tatCaDat ? "bắt thi" : "đánh dấu đã đạt"} cho ${hvChon.length} HV">${tatCaDat ? IC.dau : ""}${p}</button>`; }).join("")}</span>
    <button class="nut" data-act="veMdLoat">${IC.ve}Về mặc định</button>
    <button class="nut" data-act="boChon">Bỏ chọn</button></div>` : ""}`;
}

function dong(h) {
  const m = mucTu(h);
  const nguon = daSua(h) ? "Anh sửa · vừa xong" : (h.nguon || h.kq);
  const datTxt = thuTu(h.dat).length && m ? `${thuTu(h.dat).join(", ")} đạt · ` : "";
  const ghi = !m ? `<span class="inline-flex items-center gap-1.5 text-destructive font-semibold">${IC.canh}Phải bật ít nhất 1 phần</span>`
    : `<span class="font-semibold">${m.ten}</span>`;
  const phu = h.hetM && !daSua(h) ? `PM cũ: SH lại M — mô phỏng đã bỏ, không còn phần nào`
    : h.pmCu && !daSua(h) ? `PM cũ: ${h.pmCu}${S.loai === "oto" ? " — đã bỏ M" : ""}` : "";
  return `<tr class="${S.chon.has(h.i) ? "chon" : ""} ${!m ? "can" : ""}">
    <td class="px-3 py-2.5"><input type="checkbox" class="w-4 h-4 accent-[hsl(222_76%_40%)]" data-act="chon" data-i="${h.i}" ${S.chon.has(h.i) ? "checked" : ""} aria-label="Chọn ${h.ten}"></td>

    <td class="py-2.5 pr-3"><div class="inline-flex gap-1">${DM[S.loai].phan.map((p) => oPhan(h, p)).join("")}</div>
      <div class="text-[11px] text-muted-foreground mt-1 whitespace-nowrap">${datTxt}${nguon}</div></td>
    <td class="py-2.5 pr-3"><div class="flex items-center gap-2">${ghi}
      ${daSua(h) ? `<button class="text-[12px] text-tn font-semibold inline-flex items-center gap-1" data-act="veMd" data-i="${h.i}" title="Về như tool điền sẵn">${IC.ve}Mặc định</button>` : ""}</div>
      ${phu ? `<div class="text-[11px] text-muted-foreground mt-0.5">${phu}</div>` : ""}</td>
  </tr>`;
}

function daLuu() { const d = new Date(); S.luu = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

  return dau() + `<div class="ml-auto flex items-center gap-2">

function manLoi() {

    <div class="max-w-[520px] text-[13.5px]">
      <div class="flex items-center gap-2 text-destructive font-semibold text-[15px]">${IC.canh}Máy này chưa dựng được bản in Báo cáo 2</div>
      <p class="mt-2">Tool dùng mẫu in và bộ chạy Crystal của <b>phần mềm cũ</b> để bản in giống hệt. Không tìm thấy <span class="tabnum">rptBaoCao2.rpt</span> trong thư mục đã cài:</p>
      <p class="mt-1 rounded-md bg-muted px-3 py-2 tabnum text-[12.5px]">D:\\GPLX-v3.1.0.6\\GPLX-v3.1.0.6</p>
      <p class="mt-2 text-muted-foreground">Chọn đúng thư mục cài phần mềm cũ (có thư mục PM1\\Reports). Lựa chọn nội dung thi vẫn được giữ.</p>
      <div class="mt-4 flex gap-2"><button class="nut chinh">Chọn thư mục phần mềm cũ…</button><button class="nut" data-act="veChon">Quay lại sửa nội dung thi</button></div>
    </div></div>`;
}

// ⓪ Màn Danh sách BC2 có sẵn (TNB-07) — gắn lối vào In BC2 + cải thiện
const BC2 = [
  { so: "81/TTTĐ", ngay: "06/11/2026", bc1: "45/TTTĐ", kh: "B · K26B0999", tong: 128, hv: 128, mo: true, nguoi: "thu1", ban: "Đã in 06/11 · 3 chọn lại" },
  { so: "83/TTTĐ", ngay: "06/11/2026", bc1: "47/TTTĐ", kh: "B.01 · K26B0108", tong: 75, hv: 75, mo: true, nguoi: "thu1", ban: "" },
  { so: "82/TTTĐ", ngay: "06/11/2026", bc1: "46/TTTĐ", kh: "C1 · K26C1009", tong: 127, hv: 126, mo: true, nguoi: "admin", ban: "Đang chọn · 1 cần chọn", can: true },
  { so: "77/2026", ngay: "03/10/2026", bc1: "41/2026", kh: "B · K26B0107", tong: 42, hv: 40, mo: false, nguoi: "thu1", ban: "Đã in 03/10" },
  { so: "76/2026", ngay: "03/10/2026", bc1: "40/2026", kh: "B · K26B0106", tong: 51, hv: 51, mo: false, nguoi: "admin", ban: "" },
];
function manDs() {
  const q = (S.qDs || "").toLowerCase();
  const ds = BC2.filter((b) => (S.dsMo ? b.mo : !b.mo) && (!q || (b.so + b.kh + b.bc1).toLowerCase().includes(q)));
  return `<div class="px-5 pt-4 pb-3 border-b border-border">
      <div class="flex items-start gap-3"><div><h1 class="text-lg font-bold">Báo cáo 2</h1>
        <p class="text-[13px] text-muted-foreground mt-0.5">Lập BC2 mới, thêm/gỡ học viên, <b class="text-foreground font-semibold">chọn nội dung thi và in BC2</b>.</p></div></div>
      <div class="mt-3 flex flex-wrap items-center gap-2">
        <div class="inline-flex rounded-lg border border-border overflow-hidden"><button class="h-9 px-4 text-[13px] font-semibold bg-tn text-white">Ô tô</button><button class="h-9 px-4 text-[13px] font-semibold bg-white">Mô tô</button></div>
        <button class="nut chinh">Lập BC2 mới</button><button class="nut">Tạo BC2 rỗng</button>
      </div></div>
    <div class="px-5 py-3 flex flex-wrap items-center gap-2">
      <div class="inline-flex rounded-lg border border-border overflow-hidden">
        <button class="h-8 px-3 text-[12.5px] font-semibold ${S.dsMo ? "bg-tn-soft text-tn" : "bg-white"}" data-ds="mo">Đang mở</button>
        <button class="h-8 px-3 text-[12.5px] font-semibold ${!S.dsMo ? "bg-tn-soft text-tn" : "bg-white"}" data-ds="dong">Đã đóng</button></div>
      <label class="relative"><span class="absolute left-2.5 top-[10px] text-muted-foreground">${IC.tim}</span>
        <input class="o-tim w-[260px]" placeholder="Tìm số BC2, BC1, tên khóa" value="${S.qDs || ""}" data-act="timDs" aria-label="Tìm BC2"></label>
      <span class="ml-auto text-[12px] text-muted-foreground">BC2 đã đóng vẫn in lại được; chỉ không thêm/gỡ học viên.</span>
    </div>
    <div class="px-5 pb-5"><div class="rounded-xl border border-border overflow-hidden"><table class="w-full text-[13px]">
      <thead class="bg-[hsl(210_40%_98%)] border-b border-border"><tr>
        <th class="px-3 py-2">Số BC2</th><th class="py-2 pr-3">Ngày</th><th class="py-2 pr-3">BC1</th><th class="py-2 pr-3">Hạng · Khóa</th>
        <th class="py-2 pr-3 text-right">Học viên</th><th class="py-2 pr-3">Bản in</th><th class="py-2 pr-3">Người tạo</th><th class="py-2 pr-3"></th></tr></thead>
      <tbody>${ds.map((b) => `<tr class="cursor-pointer">
        <td class="px-3 py-2.5 font-semibold tabnum whitespace-nowrap">${b.so}</td>
        <td class="py-2.5 pr-3 tabnum">${b.ngay}</td><td class="py-2.5 pr-3 tabnum text-muted-foreground">${b.bc1}</td>
        <td class="py-2.5 pr-3">${b.kh}</td>
        <td class="py-2.5 pr-3 text-right tabnum">${b.hv}${b.tong !== b.hv ? ` <span class="text-[11px] text-muted-foreground" title="Tổng ghi trên BC2 khác số học viên thực tế — bình thường">/ ghi ${b.tong}</span>` : ""}</td>
        <td class="py-2.5 pr-3 whitespace-nowrap">${b.ban ? `<span class="the ${b.can ? "do" : "md"}">${b.ban}</span>` : `<span class="text-muted-foreground text-[12px]">Chưa in từ tool</span>`}</td>
        <td class="py-2.5 pr-3 text-muted-foreground">${b.nguoi}</td>
        <td class="py-2.5 pr-3 text-right whitespace-nowrap">
          <div class="inline-flex items-center gap-1.5 align-middle">
            <button class="nut nho">Xem</button>
            <button class="nut nho" data-act="inTuDs">${IC.in}In BC2</button>
            ${b.mo ? `<button class="nut nho chinh">+ Thêm HV</button>` : ""}
          </div></td></tr>`).join("") ||
        `<tr><td colspan="8" class="py-10 text-center text-muted-foreground">Không có BC2 khớp.</td></tr>`}</tbody></table></div></div>`;
}

function ve2() {
  const app = document.getElementById("app");
  app.innerHTML = S.man === "ds" ? manDs() : S.man === "chon" ? manChon() : S.man === "xem" ? manXem() : manLoi();
  app.querySelectorAll("[data-ds]").forEach((b) => (b.onclick = () => { S.dsMo = b.dataset.ds === "mo"; ve2(); }));
  app.querySelectorAll("[data-loc]").forEach((b) => (b.onclick = () => { S.loc = b.dataset.loc; ve2(); }));
  app.querySelectorAll("[data-act]").forEach((el) => {
    const a = el.dataset.act, h = S.hv[Number(el.dataset.i)];
    const giuTieuDiem = (sel) => { ve2(); const o = document.querySelector(sel); if (o) { o.focus(); if (o.setSelectionRange) o.setSelectionRange(o.value.length, o.value.length); } };
    if (a === "tim") el.oninput = () => { S.q = el.value; giuTieuDiem('[data-act="tim"]'); };
    else if (a === "timDs") el.oninput = () => { S.qDs = el.value; giuTieuDiem('[data-act="timDs"]'); };
    else if (a === "chon") el.onchange = () => { el.checked ? S.chon.add(h.i) : S.chon.delete(h.i); ve2(); };
    else el.onclick = () => {
      if (a === "pt") { const p = el.dataset.p; h.dat = h.dat.includes(p) ? h.dat.filter((x) => x !== p) : [...h.dat, p]; daLuu(); giuTieuDiem(`[data-act="pt"][data-i="${h.i}"][data-p="${p}"]`); }
      if (a === "ptLoat") { const p = el.dataset.p; const ds = S.hv.filter((x) => S.chon.has(x.i)); const tatCaDat = ds.every((x) => x.dat.includes(p));
        ds.forEach((x) => { x.dat = tatCaDat ? x.dat.filter((y) => y !== p) : [...new Set([...x.dat, p])]; }); daLuu(); ve2(); }
      if (a === "chonHet") { const vis = [...document.querySelectorAll('[data-act="chon"]')].map((x) => Number(x.dataset.i)); const het = vis.every((i) => S.chon.has(i)); vis.forEach((i) => het ? S.chon.delete(i) : S.chon.add(i)); ve2(); }
      if (a === "veMd") { h.dat = [...h.datGoc]; daLuu(); ve2(); }
      if (a === "veMdLoat") { S.hv.filter((x) => S.chon.has(x.i)).forEach((x) => (x.dat = [...x.datGoc])); S.chon.clear(); daLuu(); ve2(); }
      if (a === "boChon") { S.chon.clear(); ve2(); }
      if (a === "xemTruoc") datMan("xem");
      if (a === "veChon") datMan("chon");
      if (a === "veXem") datMan("ds");
      if (a === "inTuDs") datMan("chon");
    };
  });
}

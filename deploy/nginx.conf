# nginx VPS: phục vụ static PWA + reverse proxy /api → FastAPI (TDD §2.1).
# Cùng domain nên app web và API same-origin, không cần CORS.
# SSL (443 + cert) thêm ở bước /deploy go-live.

server {
    listen 80;
    server_name _;

    # Giới hạn cỡ upload ảnh thô (task 15 nhận ảnh chân dung)
    client_max_body_size 15m;

    # API → FastAPI container
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App web PWA (static build của webapp/) — SPA fallback
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

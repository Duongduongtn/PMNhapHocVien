# VPS: api (FastAPI) + postgres + nginx (TDD §2.1, §2.4).
# tool/ KHÔNG lên docker — đóng gói .exe riêng.
# Giá trị bí mật đọc từ .env (không commit; xem .env.example).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thunhan_db}
      POSTGRES_USER: ${POSTGRES_USER:-thunhan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Phai dat POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Nạp schema lần đầu khởi tạo (TDD §3.2)
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thunhan} -d ${POSTGRES_DB:-thunhan_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./server
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thunhan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thunhan_db}
      JWT_SECRET: ${JWT_SECRET:?Phai dat JWT_SECRET trong .env}
      ANH_THO_DIR: /data/anh-tho
      PII_RETENTION_DAYS: ${PII_RETENTION_DAYS:-30}
      TOOL_API_KEY: ${TOOL_API_KEY:?Phai dat TOOL_API_KEY trong .env}
    volumes:
      - anh_tho:/data/anh-tho
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Static PWA do webapp build ra (task 13). Trống tới khi có build.
      - ./webapp/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  anh_tho:

# Production compose — image từ ghcr.io, KHÔNG build tại VPS. Đặt ở /opt/nhaphocvien/.
# IMAGE_TAG_API / IMAGE_TAG_WEB: workflow truyền FULL URL
#   ghcr.io/duongduongtn/pmnhaphocvien-api:<sha> · ...-web:<sha>.
# Chỉ 'web' mở cổng host (127.0.0.1:3012 → nginx host proxy); api + postgres nội bộ.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: ${IMAGE_TAG_API:-ghcr.io/duongduongtn/pmnhaphocvien-api:latest}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - anh_tho:/data/anh-tho
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: ${IMAGE_TAG_WEB:-ghcr.io/duongduongtn/pmnhaphocvien-web:latest}
    ports:
      - "127.0.0.1:3012:80"
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  anh_tho:

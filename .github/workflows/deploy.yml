name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMG_API: ghcr.io/duongnamdata/pmnhaphocvien-api
  IMG_WEB: ghcr.io/duongnamdata/pmnhaphocvien-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ env.IMG_API }}:${{ github.sha }},${{ env.IMG_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push WEB
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/web.Dockerfile
          push: true
          tags: ${{ env.IMG_WEB }}:${{ github.sha }},${{ env.IMG_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            # Empty isolated docker config: anonymous pull of PUBLIC images, avoid stale ghcr cred (trap 4).
            export DOCKER_CONFIG=/tmp/pmnhap-docker
            mkdir -p "$DOCKER_CONFIG"
            cd "${{ secrets.VPS_APP_PATH }}"
            export IMAGE_TAG_API=${{ env.IMG_API }}:${{ github.sha }}
            export IMAGE_TAG_WEB=${{ env.IMG_WEB }}:${{ github.sha }}
            PREV=$(cat .last_good_sha 2>/dev/null || echo "")

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Health check: web trả 200 trong 60s
            HEALTHY=0
            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null http://127.0.0.1:3012/; then HEALTHY=1; break; fi
              sleep 3
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "::error::Health check FAIL cho web:3012"
              if [ -n "$PREV" ]; then
                echo "Lùi về bản tốt trước: $PREV"
                export IMAGE_TAG_API=${{ env.IMG_API }}:$PREV
                export IMAGE_TAG_WEB=${{ env.IMG_WEB }}:$PREV
                docker compose -f docker-compose.prod.yml up -d
              fi
              docker compose -f docker-compose.prod.yml logs --tail=50 api web
              exit 1
            fi

            echo "${{ github.sha }}" > .last_good_sha
            echo "Deploy OK — sha ${{ github.sha }}"

            # Dọn image cũ của dự án này, giữ 3 bản gần nhất (best-effort, không làm hỏng deploy)
            for IMG in ${{ env.IMG_API }} ${{ env.IMG_WEB }}; do
              docker images "$IMG" --format '{{.CreatedAt}}~{{.ID}}' \
                | sort -r | cut -d'~' -f2 | awk '!seen[Deploy]++' | tail -n +4 \
                | xargs -r docker rmi -f 2>/dev/null || true
            done
            docker builder prune -f >/dev/null 2>&1 || true
